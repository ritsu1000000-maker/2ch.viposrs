<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運営情報 - 〇〇掲示板</title>
    <style>
        body {
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            border-bottom: 3px solid #0056b3;
            padding-bottom: 10px;
            color: #0056b3;
            font-size: 1.5rem;
        }
        p {
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 15px;
            text-align: left;
        }
        th {
            background-color: #f9f9f9;
            width: 30%;
            font-weight: bold;
            white-space: nowrap;
        }
        a {
            color: #0056b3;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .small-text {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>運営情報</h1>
        <p>当掲示板は、以下の体制で運営・管理を行っております。</p>

        <table>
            <tbody>
                <tr>
                    <th>サイト名</th>
                    <td>〇〇掲示板</td>
                </tr>
                <tr>
                    <th>運営者（責任者）</th>
                    <td>〇〇運営事務局（または代表者名）</td>
                </tr>
                <tr>
                    <th>運営目的</th>
                    <td>同じ趣味を持つユーザー同士の健全な情報交換と交流の場を提供するため</td>
                </tr>
                <tr>
                    <th>開設日</th>
                    <td>202X年X月X日</td>
                </tr>
                <tr>
                    <th>推奨環境</th>
                    <td>Google Chrome、Safari、Edge、Firefox の各最新版</td>
                </tr>
                <tr>
                    <th>免責事項</th>
                    <td>当掲示板を利用したことによる、ユーザー間のトラブルや損害につきましては、運営者は一切の責任を負いかねます。</td>
                </tr>
                <tr>
                    <th>お問い合わせ先</th>
                    <td>
                        メール： <a href="mailto:info@example.com">info@example.com</a><br>
                        <div class="small-text">※お問い合わせ内容によっては、ご返信までに数営業日いただく場合がございます。</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
